[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.94"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
gitbello-core = { path = "crates/gitbello-core" }
# Pinned: gdext is pre-1.0. The api feature must match the Godot version in godot/project.godot.
godot = { version = "=0.5.5", features = ["api-4-7"] }
anyhow = "1"
thiserror = "2"
notify = "8.2"
# Config fields are mapped by hand from toml::Table (no serde derive), so unknown keys survive a save.
toml = { version = "1.1", default-features = false, features = ["std", "serde", "parse", "display"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"

# Dependencies (godot, thiserror, ...) are optimized even in dev builds: the
# Godot editor always loads the debug library, and unoptimized gdext type
# conversion dominates frame times otherwise. They compile once and are cached.
[profile.dev.package."*"]
opt-level = 2

# Graph layout replays up to CHECKPOINT_INTERVAL rows per slice; keep it fast in
# dev builds too. Debug assertions and overflow checks stay on.
[profile.dev.package.gitbello-core]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
