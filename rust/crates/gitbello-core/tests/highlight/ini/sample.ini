; Comment
# Another comment
[core]
	editor = code --wait
	autocrlf = false
	pager = less -R ; inline comment

[remote "origin"]
	url = https://github.com/example/repo.git
	fetch = +refs/heads/*:refs/remotes/origin/*

[settings]
timeout = 30
ratio = -0.5
name = "quoted value"
enabled = yes
empty =
key.with.dots = value
