[package]
name = "gitbello-core"
description = "gitbello core: git access, models, graph layout and job scheduling. No Godot dependency."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
# The integration tests are modules of one binary (tests/core.rs).
autotests = false

[lib]
# No doc examples to run; the tests live in the modules and tests/.
doctest = false

[dependencies]
thiserror.workspace = true
notify.workspace = true
toml.workspace = true
sha2.workspace = true

[lints]
workspace = true

[[test]]
name = "core"
path = "tests/core.rs"
