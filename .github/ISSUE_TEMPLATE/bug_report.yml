name: Bug report
description: Something in gitbello doesn't work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. Please check the open issues first, in case it is already known.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What went wrong, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a repository with …
        2. Click …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: gitbello version
      description: Help > About.
      placeholder: "1.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: OS version
      placeholder: "Windows 11 24H2, macOS 15.3, Ubuntu 24.04…"
  - type: input
    id: git
    attributes:
      label: git version
      description: The output of `git --version`.
      placeholder: "git version 2.47.1"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output or error details
      description: The error's details (its toast has Details), or the output when gitbello runs from a terminal. Remove anything private, such as paths or remote URLs.
      render: text
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images here if they help.
