name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep in sync with config/features in godot/project.godot and the gdext api-* feature.
  GODOT_VERSION: 4.7.2

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            godot_zip: linux.x86_64
            godot_bin: Godot_v4.7.2-stable_linux.x86_64
          - os: windows-latest
            godot_zip: win64.exe
            godot_bin: Godot_v4.7.2-stable_win64_console.exe
          - os: macos-latest
            godot_zip: macos.universal
            godot_bin: Godot.app/Contents/MacOS/Godot
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: fmt, clippy, test
        run: cargo xtask check

      - name: Build gdext (release)
        run: cargo xtask build --release

      - name: Install Godot
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          zip="Godot_v${GODOT_VERSION}-stable_${{ matrix.godot_zip }}.zip"
          dir="$RUNNER_TEMP/godot"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/$zip" "$base/$zip"
          curl -fsSL -o "$dir/SHA512-SUMS.txt" "$base/SHA512-SUMS.txt"
          # Tool availability differs per runner: macOS lacks sha512sum, Windows Git Bash may lack shasum/unzip.
          if command -v sha512sum >/dev/null; then sum="sha512sum"; else sum="shasum -a 512"; fi
          (cd "$dir" && grep " $zip\$" SHA512-SUMS.txt | $sum -c -)
          if command -v unzip >/dev/null; then unzip -q "$dir/$zip" -d "$dir"; else 7z x -y -o"$dir" "$dir/$zip" >/dev/null; fi
          chmod +x "$dir/${{ matrix.godot_bin }}"
          echo "GODOT=$dir/${{ matrix.godot_bin }}" >> "$GITHUB_ENV"

      - name: Smoke tests (headless import + smoke scripts)
        run: cargo xtask smoke
